name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      formulae:
        description: JSON array of formulae to test. Defaults to every formula.
        type: string
        default: ""
      artifact-pattern:
        description: Download artifacts matching this pattern into Formula/ before testing.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        formula: ${{ fromJSON(inputs.formulae || '["discordcli-agents", "gronify", "openrig"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Use the updated formulae
        if: inputs.artifact-pattern != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-pattern }}
          merge-multiple: true
          path: Formula
      - name: Remove the runner's openssl@1.1 links
        # The macOS image links openssl@1.1 into the prefix outside Homebrew's
        # records (brew unlink removes nothing), which blocks linking openssl@3
        # when node@22's dependencies are upgraded.
        if: runner.os == 'macOS'
        run: find "$(brew --prefix)"/{bin,include,lib,share} -type l -lname '*openssl@1.1*' -print -delete 2>/dev/null || true
      - name: Audit formula
        env:
          FORMULA: ${{ matrix.formula }}
        run: brew audit --strict "1solomonwakhungu/tap/$FORMULA"
      - name: Install formula
        env:
          FORMULA: ${{ matrix.formula }}
        run: brew install --build-from-source "1solomonwakhungu/tap/$FORMULA"
      - name: Test formula
        env:
          FORMULA: ${{ matrix.formula }}
        run: brew test "1solomonwakhungu/tap/$FORMULA"
