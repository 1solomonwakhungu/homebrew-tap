name: Bump Formula

# Bumps one formula, tests it, and commits it to main. Called by the
# Update Formulae workflow once per formula with an upstream update.

on:
  workflow_call:
    inputs:
      formula:
        type: string
        required: true
      version:
        type: string
        required: true
      python-package:
        description: Python package name, to also regenerate the formula's resources
        type: string
        default: ""
      commit:
        description: Commit the tested formula to main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Update the formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          FORMULA: ${{ inputs.formula }}
          VERSION: ${{ inputs.version }}
          PYTHON_PACKAGE: ${{ inputs.python-package }}
        run: |
          set -euo pipefail
          args=(--write-only --no-audit --version "$VERSION")
          if [[ -n "$PYTHON_PACKAGE" ]]; then
            # Also regenerates the formula's Python resource blocks.
            args+=(--python-package-name "$PYTHON_PACKAGE")
          fi
          brew bump-formula-pr "${args[@]}" "1solomonwakhungu/tap/$FORMULA"
          git diff --exit-code --quiet -- "Formula/$FORMULA.rb" && {
            echo "::error::brew bump-formula-pr left Formula/$FORMULA.rb unchanged"
            exit 1
          }
          git diff -- "Formula/$FORMULA.rb"
      - name: Upload the updated formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula-${{ inputs.formula }}
          path: Formula/${{ inputs.formula }}.rb
          if-no-files-found: error

  test:
    needs: bump
    uses: ./.github/workflows/tests.yml
    with:
      formulae: ${{ format('["{0}"]', inputs.formula) }}
      artifact-pattern: formula-${{ inputs.formula }}

  commit:
    needs: test
    if: inputs.commit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the updated formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula-${{ inputs.formula }}
          path: Formula
      - name: Commit the updated formula to main
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA: ${{ inputs.formula }}
          VERSION: ${{ inputs.version }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path="Formula/$FORMULA.rb"

          # The blob from the commit the tests ran on. GitHub rejects the
          # write if main has changed this file since then.
          blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$TESTED_SHA" --jq .sha)"

          # base64 encodes the file byte for byte, trailing newline included.
          jq -n \
            --arg message "feat: update $FORMULA to $VERSION" \
            --arg content "$(base64 < "$path" | tr -d '\n')" \
            --arg sha "$blob" \
            '{message: $message, content: $content, sha: $sha, branch: "main"}' > request.json

          # Other formulae can commit to main at the same moment, which makes
          # GitHub reject a write with 409 even though the files differ.
          # A retry after a write that succeeded but lost its response would
          # fail, so stop once main holds this exact file.
          local_blob="$(git hash-object "$path")"
          for attempt in 1 2 3 4 5; do
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input request.json --jq .commit.html_url; then
              exit 0
            fi
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha || true)" == "$local_blob" ]]; then
              echo "main already has this $path"
              exit 0
            fi
            echo "::warning::Commit attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Could not commit $path to main"
          exit 1
